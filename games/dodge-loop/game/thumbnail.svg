<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dodge Loop</title>
  <desc id="desc">A neon lime player dodges glowing blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4c" />
      <stop offset="1" stop-color="#090f1d" />
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)" />
  <g opacity=".12" stroke="#b8f36b">
    <path d="M0 190h1200M0 380h1200M0 570h1200M300 0v760M600 0v760M900 0v760" />
  </g>
  <circle cx="970" cy="135" r="160" fill="none" stroke="#a590ff" stroke-opacity=".35" stroke-width="2" />
  <circle cx="970" cy="135" r="92" fill="none" stroke="#b8f36b" stroke-opacity=".35" stroke-width="2" />
  <g filter="url(#glow)" fill="#a590ff"><rect x="205" y="110" width="80" height="80"/><rect x="780" y="300" width="104" height="104"/></g>
  <g filter="url(#glow)" fill="#b8f36b"><rect x="490" y="215" width="70" height="70"/><rect x="315" y="505" width="94" height="94"/></g>
  <rect x="560" y="650" width="130" height="24" rx="12" fill="#fff" filter="url(#glow)" />
  <text x="70" y="95" fill="#b8f36b" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">ONE MINUTE SURVIVAL</text>
  <text x="70" y="365" fill="#fff" font-family="Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-5">DODGE</text>
  <text x="70" y="455" fill="#b8f36b" font-family="Arial, sans-serif" font-size="92" font-weight="900" letter-spacing="-5">LOOP</text>
</svg>
