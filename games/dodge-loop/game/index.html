<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Dodge Loop</title>
    <link rel="stylesheet" href="./game.css?v=2026-08-25T07%3A37%3A01.499Z" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div>
          <span class="label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="best-wrap">
          <span class="label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </header>
      <div class="game-tools">
        <button class="pause-toggle" type="button" id="pause-toggle" aria-pressed="false" aria-label="게임 일시정지" disabled>PAUSE</button>
        <button class="sound-toggle" type="button" id="sound-toggle" aria-pressed="true" aria-label="게임 사운드 끄기">SOUND ON</button>
      </div>
      <section class="canvas-wrap">
        <canvas id="game" width="720" height="1000" aria-label="Dodge Loop 게임 화면"></canvas>
        <div class="overlay" id="overlay">
          <div class="eyebrow">ONE MINUTE SURVIVAL</div>
          <h1 id="overlay-title">DODGE<br /><em>LOOP</em></h1>
          <p id="overlay-copy">떨어지는 블록을 피하고<br />최고 기록에 도전하세요.</p>
          <button id="start-button" type="button">START</button>
        </div>
        <div class="pause-overlay" id="pause-overlay" hidden aria-live="polite">
          <div class="pause-title">PAUSED</div>
          <button class="resume-button" id="resume-button" type="button" aria-label="게임 재개">RESUME</button>
          <p class="pause-copy">RESUME 버튼을 눌러 계속하세요</p>
        </div>
      </section>
      <p class="hint">화면을 터치하거나 ← → 키로 이동 · PAUSE 버튼 또는 P / ESC로 일시정지</p>
    </main>
    <script src="./game.js?v=2026-08-25T07%3A37%3A01.499Z"></script>
    <script src="../../../assets/game-frame-bridge.js?v=2026-08-25T07%3A37%3A01.499Z"></script>
</body>
</html>
