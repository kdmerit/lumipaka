<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" role="img" aria-labelledby="title desc">
  <title id="title">Smash Rally 썸네일</title>
  <desc id="desc">어두운 세로 코트 위에서 라임색 공을 주고받는 두 개의 패들</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#101a31" />
      <stop offset="1" stop-color="#0c1428" />
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="720" height="960" fill="#090e1d" />
  <rect x="44" y="96" width="632" height="792" rx="34" fill="url(#field)" stroke="rgba(255,255,255,.14)" />
  <g stroke="#b8f36b" stroke-opacity=".08">
    <path d="M44 294h632M44 492h632M44 690h632" />
    <path d="M202 96v792M360 96v792M518 96v792" />
  </g>
  <path d="M112 492h496" stroke="#b8f36b" stroke-opacity=".38" stroke-width="4" stroke-dasharray="14 16" />
  <rect x="252" y="160" width="216" height="22" rx="11" fill="#f7f8ff" />
  <rect x="252" y="800" width="216" height="22" rx="11" fill="#f7f8ff" />
  <circle cx="406" cy="452" r="19" fill="#b8f36b" filter="url(#glow)" />
  <text x="360" y="58" fill="#f7f8ff" font-family="Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="6" text-anchor="middle">SMASH <tspan fill="#b8f36b">RALLY</tspan></text>
</svg>
