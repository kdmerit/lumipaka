<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Brick Loop</title>
    <link rel="stylesheet" href="./game.css?v=2026-08-24T13%3A07%3A52.235Z" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hud">
        <div><span class="label">SCORE</span><strong id="score">0</strong></div>
        <div class="center-title">BRICK <em>LOOP</em></div>
        <div class="right-hud"><span class="label">BEST <b id="best">0</b></span><span class="label">LIVES <b id="lives">3</b></span></div>
      </header>
      <div class="game-tools">
        <div class="powerup-status" id="powerups" aria-live="polite">POWER-UPS —</div>
        <button class="sound-toggle" type="button" id="sound-toggle" aria-pressed="true" aria-label="게임 사운드 끄기">SOUND ON</button>
      </div>
      <section class="canvas-wrap">
        <canvas id="game" width="720" height="960" aria-label="Brick Loop 게임 화면"></canvas>
        <div class="overlay" id="overlay">
          <div class="eyebrow">BREAK THE PATTERN</div>
          <h1 id="overlay-title">BRICK<br /><em>LOOP</em></h1>
          <p id="overlay-copy">공을 튕겨 모든 브릭을 부수세요.<br />패들이 공을 기다리고 있습니다.</p>
          <button id="start-button" type="button">START</button>
        </div>
      </section>
      <p class="hint">화면을 좌우로 드래그해 패들 이동 · 스페이스로 시작</p>
      <p class="item-hint">아이템: W 패들 확대 · 3 멀티볼 · S 실드 · F 관통 · ×2 점수 · +1 라이프</p>
    </main>
    <script src="./game.js?v=2026-08-24T13%3A07%3A52.235Z"></script>
    <script src="../../../assets/game-frame-bridge.js?v=2026-08-24T13%3A07%3A52.235Z"></script>
</body>
</html>
